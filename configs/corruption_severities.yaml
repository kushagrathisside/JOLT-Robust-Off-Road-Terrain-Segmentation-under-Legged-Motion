# JOLT corruption severity ladders (mirrors jolt/corruptions/severity.py).
# Plausible starting values per RESEARCH.md §5.1 — calibrate to real legged
# IMU/gait data when available (kernel length ~ angular velocity x exposure).
motion_blur:
  param: kernel_length_px
  severities: {1: 3, 2: 7, 3: 11, 4: 15, 5: 21}
rolling_shutter:
  param: max_bottom_row_shift_px
  severities: {1: 2, 2: 4, 3: 8, 4: 16, 5: 32}
jitter:
  param: rotation_sigma_deg
  severities: {1: 0.5, 2: 1.0, 3: 2.0, 4: 4.0, 5: 8.0}
composite:
  name: legged
  note: apply jitter -> rolling_shutter -> motion_blur at one matched severity
